<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blackjack Quiz – TikTok-Postfach</title>
<style>
  :root { --bg:#0b1120; --card:#131c31; --line:#24304a; --text:#e8edf5; --muted:#8d9ab3; --accent:#f28c28; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
  article { background:var(--card); border-top:5px solid var(--accent); padding:14px; margin:0 0 22px; }
  article.done { border-top-color:var(--line); opacity:.6; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:4px; }
  h2 { font-size:17px; margin:0 0 10px; }
  video { display:block; height:min(52vh, 560px); width:auto; aspect-ratio:9/16; margin:0 auto; background:#000; }
  textarea { width:100%; min-height:120px; margin:10px 0 8px; background:var(--bg); color:var(--text); border:1px solid var(--line); padding:8px; font-family:inherit; font-size:14px; line-height:1.4; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  a.btn, button { flex:1 1 140px; text-align:center; padding:11px 12px; font-weight:700; font-size:15px; border:0; cursor:pointer; text-decoration:none; }
  a.btn { background:var(--accent); color:#111; }
  button { background:var(--line); color:var(--text); }
  label { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
<h1>TikTok-Postfach</h1>
<p class="sub">Video speichern, in TikTok hochladen, Text einfügen. YouTube läuft automatisch.</p>
<article data-date="2026-11-01">
  <div class="meta">#1 · 2026-11-01</div>
  <h2>8-8 vs 9: Split or not? | Blackjack Quiz #1</h2>
  <video src="v/2026-11-01.mp4#t=1" controls playsinline preload="metadata"></video>
  <textarea readonly>8-8 vs 9: what's your move? 🃏 Blackjack Quiz #1
3 hands, 3 seconds each. How many did you get? 👇
Math &amp; strategy education — not gambling advice. 18+

#blackjack #basicstrategy #cardgames #math #quiz</textarea>
  <div class="row">
    <a class="btn" href="v/2026-11-01.mp4" download="blackjack-quiz-1.mp4">Video speichern</a>
    <button type="button" data-copy>Text kopieren</button>
  </div>
  <label><input type="checkbox" data-done> Auf TikTok gepostet</label>
</article>
<p class="sub"><a href="privacy.html" style="color:var(--muted)">Privacy Policy / Datenschutz</a></p>
</main>
<script>
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  document.querySelectorAll('article').forEach((a) => {
    const key = 'posted-' + a.dataset.date;
    const box = a.querySelector('[data-done]');
    box.checked = store.get(key) === '1';
    a.classList.toggle('done', box.checked);
    box.addEventListener('change', () => { store.set(key, box.checked ? '1' : '0'); a.classList.toggle('done', box.checked); });
    const btn = a.querySelector('[data-copy]');
    btn.addEventListener('click', async () => {
      const t = a.querySelector('textarea');
      try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); }
      btn.textContent = 'Kopiert ✓';
      setTimeout(() => (btn.textContent = 'Text kopieren'), 1500);
    });
  });
</script>
</body>
</html>
